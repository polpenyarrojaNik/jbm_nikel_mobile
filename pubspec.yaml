  jwt_decoder: ^2.0.1
  logger: ^2.6.2
  map_launcher: ^4.4.2
  material_design_icons_flutter: ^7.0.7296
  money2: ^6.1.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  reactive_forms: ^18.2.2
  riverpod_annotation: ^4.0.0
  share_plus: ^12.0.1
  shimmer: ^3.0.0
  sentry_flutter: ^9.10.0
  sqlite3_flutter_libs: ^0.5.41
  syncfusion_flutter_pdf: ^32.1.23
  syncfusion_flutter_pdfviewer: ^32.1.23
  upgrader: ^12.5.0
  url_launcher: ^6.3.2
  uuid: ^4.5.2
  gap: ^3.0.1

dev_dependencies:
  sentry_dart_plugin: ^3.2.1
  flutter_test:
    sdk: flutter
  auto_route_generator: ^10.4.0
  build_runner: ^2.10.5
  dependency_validator: ^5.0.3
  drift_dev: ^2.30.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0+1
  intl_utils: ^2.8.13

dependency_overrides:
  better_open_file:
    git:
      url: https://github.com/AndreLuizNogueira/better_open_file.git
      ref: master
  excel:
    git:
      url: https://github.com/justkawal/excel
      ref: 37e0807f97fe8c293bdf75441cf21413b322882d

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icons/1x/photokits_app_icon_1024x1024.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/app_icons/1x/photokits_app_icon_1024x1024.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/templates/
    - assets/app_icons/

flutter_intl:
  enabled: true

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter-jbm-nikel-mobile
  org: nikel-consultores-sl
  ignore_missing: true
