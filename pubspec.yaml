dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  flutter_test:
    sdk: flutter
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.8
  intl_utils: ^2.8.16

dependency_overrides:
  flutter_rotation_sensor: 0.2.0
  # sentry_flutter 9.20.0 depends on jni for Android. The upstream jni
  # Windows plugin requires a local JDK during CMake generation, so this local
  # copy keeps Android support but does not register jni on Windows.
  jni:
    path: packages/jni_no_windows
  # path_provider_android 2.3.0+ depends on jni_flutter, which requires
  # jni ^1.0.0 — incompatible with the jni_no_windows override above (0.14.2
  # API). Pin to the last version without that dependency.
  path_provider_android: 2.2.23

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icons/1x/photokits_app_icon_1024x1024.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/app_icons/1x/photokits_app_icon_1024x1024.png"
  web:
    generate: false
  windows:
    image_path: "assets/app_icons/1x/photokits_app_icon_1024x1024.png"
    generate: true
    icon_size: 48
  macos:
    generate: false

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/templates/
    - assets/app_icons/

flutter_intl:
  enabled: true

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  upload_sources: true
